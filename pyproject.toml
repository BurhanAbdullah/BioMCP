[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomcp"
version = "0.2.0"
description = "Open MCP platform for biology, bioinformatics, bioimaging, and scientific AI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "BioMCP Contributors"}]
license = {text = "MIT"}
keywords = ["mcp", "biology", "bioinformatics", "bioimaging", "imagej", "cellprofiler", "llm", "scientific-ai"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Scientific/Engineering"]
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
bioimage = ["numpy>=1.24", "tifffile>=2023", "scikit-image>=0.22"]
imagej = ["pyimagej>=1.7"]
llm = []
test = ["pytest>=8,<9"]
all = ["numpy>=1.24", "tifffile>=2023", "scikit-image>=0.22", "pyimagej>=1.7", "pytest>=8,<9"]

[project.scripts]
biomcp = "biomcp.cli:main"
biomcp-bioimage = "biomcp_servers.bioimage:main"
biomcp-imagej = "biomcp_servers.imagej:main"
biomcp-llm = "biomcp_servers.llm:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biomcp = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
