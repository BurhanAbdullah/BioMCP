name: BioMCP CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m biomcp --version
      - run: python -m biomcp list
      - run: python -m biomcp install --servers bioimage,imagej,llm --clients generic --dry-run
      - name: Validate live BioImage MCP contract
        run: python -m biomcp validate bioimage
      - name: Validate registry contract and source/package consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from biomcp.registry import load_registry

          root = json.loads(Path('biomcp/registry.json').read_text(encoding='utf-8'))
          packaged = json.loads(Path('src/biomcp/registry.json').read_text(encoding='utf-8'))
          assert root == packaged, 'root and packaged registries differ'
          data = load_registry()
          installable = {x['name'] for x in data['servers'] if x['installable']}
          assert installable == {'bioimage', 'imagej', 'llm'}
          assert {'pymol', 'cellprofiler', 'blastplus'} <= {x['name'] for x in data['servers']}
          print('registry contract and consistency checks passed')
          PY
      - name: Smoke-test every installable server factory
        run: |
          python - <<'PY'
          from biomcp_servers.bioimage import create_server as bioimage
          from biomcp_servers.imagej import create_server as imagej
          from biomcp_servers.llm import create_server as llm
          for name, factory in [("bioimage", bioimage), ("imagej", imagej), ("llm", llm)]:
              server = factory()
              assert server is not None, name
              print(f"{name}: factory initialized")
          PY
      - if: matrix.python-version == '3.11'
        run: python -m build

  package-consumer:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install and exercise the wheel outside the source tree
        run: |
          WHEEL=$(echo dist/*.whl)
          python -m pip install "$WHEEL[bioimage]"
          cd /tmp
          biomcp --version
          biomcp list
          biomcp validate bioimage
          python - <<'PY'
          from importlib.metadata import entry_points
          expected = {"biomcp", "biomcp-bioimage", "biomcp-imagej", "biomcp-llm"}
          actual = {ep.name for ep in entry_points(group="console_scripts") if ep.name in expected}
          assert actual == expected, actual
          PY
          python "$GITHUB_WORKSPACE/tests/test_installed_protocol.py"
      - name: Install and exercise the sdist in a clean environment
        run: |
          python -m venv /tmp/biomcp-sdist-env
          /tmp/biomcp-sdist-env/bin/python -m pip install --upgrade pip
          SDIST=$(echo dist/*.tar.gz)
          /tmp/biomcp-sdist-env/bin/python -m pip install "$SDIST[bioimage]"
          cd /tmp
          /tmp/biomcp-sdist-env/bin/biomcp --version
          /tmp/biomcp-sdist-env/bin/biomcp list
          /tmp/biomcp-sdist-env/bin/biomcp validate bioimage
          /tmp/biomcp-sdist-env/bin/python - <<'PY'
          from importlib.metadata import entry_points
          expected = {"biomcp", "biomcp-bioimage", "biomcp-imagej", "biomcp-llm"}
          actual = {ep.name for ep in entry_points(group="console_scripts") if ep.name in expected}
          assert actual == expected, actual
          PY
          /tmp/biomcp-sdist-env/bin/python "$GITHUB_WORKSPACE/tests/test_installed_protocol.py"

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=json.loads(Path('biomcp/registry.json').read_text())
          packaged=json.loads(Path('src/biomcp/registry.json').read_text())
          assert root == packaged, 'website and packaged registries must match'
          assert root['product']=='BioMCP'
          names={x['name'] for x in root['servers']}
          assert {'bioimage','imagej','llm','bionuclei','pymol','cellprofiler','blastplus'} <= names
          for path in ['docs/index.html','docs/install.html','docs/servers.html','docs/clients.html','docs/architecture.html','docs/examples.html','docs/contributing.html']:
              assert Path(path).is_file(), path
          clients = Path('docs/clients.html').read_text(encoding='utf-8')
          assert 'biomcp install --servers bioimage,llm --clients claude-code' not in clients
          assert 'biomcp install --servers bioimage,llm --clients codex' in clients
          print('website, client documentation, registry consistency, and lifecycle checks passed')
          PY
