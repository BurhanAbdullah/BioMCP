name: BioMCP CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m biomcp list
      - run: python -m biomcp install --servers bionuclei --clients generic --dry-run

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python - <<'PY'
        from pathlib import Path
        import json
        reg=json.loads(Path('biomcp/registry.json').read_text())
        assert reg['product']=='BioMCP'
        assert (Path('docs/index.html')).is_file()
        assert (Path('docs/install.html')).is_file()
        assert (Path('docs/servers.html')).is_file()
        print('website and registry checks passed')
        PY
