name: Deploy BioMCP website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'src/biomcp/registry.json'
      - 'biomcp/registry.json'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'src/biomcp/registry.json'
      - 'biomcp/registry.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate website files and local links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          root = Path("docs")
          pages = sorted(root.glob("*.html"))
          required = {"index.html", "install.html", "servers.html", "clients.html", "architecture.html", "examples.html", "documentation.html", "contributing.html"}
          names = {p.name for p in pages}
          missing_pages = sorted(required - names)
          if missing_pages:
              raise SystemExit("Missing required pages: " + ", ".join(missing_pages))

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.targets = []
                  self.presentation_targets = []
              def handle_starttag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  for key, value in attrs:
                      if key in {"href", "src"} and value:
                          self.targets.append(value)
                  if tag in {"pre", "code", "table", "thead", "tbody", "th", "td", "blockquote"} and "style" in attrs_dict:
                      self.presentation_targets.append((tag, attrs_dict["style"] or ""))

          errors = []
          for page in pages:
              text = page.read_text(encoding="utf-8")
              if not text.strip():
                  errors.append(f"empty page: {page}")
                  continue
              parser = LinkParser()
              parser.feed(text)
              for target in parser.targets:
                  clean = target.split("#", 1)[0].split("?", 1)[0]
                  if not clean or re.match(r"^(https?:|mailto:|javascript:|data:)", clean):
                      continue
                  candidate = (page.parent / clean).resolve()
                  try:
                      candidate.relative_to(root.resolve())
                  except ValueError:
                      errors.append(f"{page}: target escapes docs: {target}")
                      continue
                  if not candidate.exists():
                      errors.append(f"{page}: missing target: {target}")
              for tag, style in parser.presentation_targets:
                  if re.search(r"(?:background|background-color|color)\s*:\s*#[0-9a-fA-F]{3,8}", style):
                      errors.append(f"{page}: hardcoded color in <{tag}> style: {style}")

          if errors:
              raise SystemExit("Website validation failed:\n" + "\n".join(errors))

          css = root / "assets" / "site.css"
          if not css.is_file() or css.stat().st_size < 1000:
              raise SystemExit("Missing or unexpectedly small docs/assets/site.css")
          registry = root / "assets" / "registry.json"
          if not registry.is_file() or registry.stat().st_size < 100:
              raise SystemExit("Missing or unexpectedly small docs/assets/registry.json")
          print(f"validated {len(pages)} HTML pages and all local links")
          PY

      - name: Validate semantic color tokens and WCAG AA contrast
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          css = Path('docs/assets/site.css').read_text(encoding='utf-8')
          def block(pattern):
              match = re.search(pattern, css, re.S)
              if not match:
                  raise SystemExit(f'missing CSS token block: {pattern}')
              return match.group(1)
          light = block(r':root\{([^}]*)\}')
          dark = block(r':root\[data-theme=dark\]\{([^}]*)\}')

          def tokens(text):
              return {k: v for k, v in re.findall(r'(--[\w-]+)\s*:\s*(#[0-9A-Fa-f]{6})', text)}
          themes = {'light': tokens(light), 'dark': tokens(dark)}
          pairs = [
              ('--surface-code', '--text-code'),
              ('--surface-code-button', '--text-code-button'),
              ('--surface-table', '--text-table'),
              ('--surface-table-header', '--text-table-header'),
              ('--surface-quote', '--text-quote'),
              ('--surface-note', '--text-note'),
          ]
          def rgb(hex_color):
              return tuple(int(hex_color[i:i+2], 16) / 255 for i in (1, 3, 5))
          def linear(c):
              return c / 12.92 if c <= .04045 else ((c + .055) / 1.055) ** 2.4
          def luminance(hex_color):
              r, g, b = map(linear, rgb(hex_color))
              return .2126*r + .7152*g + .0722*b
          failures = []
          for theme, values in themes.items():
              for background, foreground in pairs:
                  if background not in values or foreground not in values:
                      failures.append(f'{theme}: missing {background} or {foreground}')
                      continue
                  l1, l2 = luminance(values[background]), luminance(values[foreground])
                  ratio = (max(l1, l2) + .05) / (min(l1, l2) + .05)
                  print(f'{theme} {background}/{foreground}: {ratio:.2f}:1')
                  if ratio < 4.5:
                      failures.append(f'{theme}: {background}/{foreground} contrast {ratio:.2f}:1 < 4.5:1')
          if failures:
              raise SystemExit('WCAG AA contrast validation failed:\n' + '\n'.join(failures))
          print('WCAG AA contrast validation passed for code, table, and quote tokens in both themes')
          PY

      - name: Validate registry consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = json.loads(Path('biomcp/registry.json').read_text(encoding='utf-8'))
          packaged = json.loads(Path('src/biomcp/registry.json').read_text(encoding='utf-8'))
          published = json.loads(Path('docs/assets/registry.json').read_text(encoding='utf-8'))
          assert root == packaged, 'root and packaged registries must match'
          assert root == published, 'published website registry must match the package registry'
          assert root['product'] == 'BioMCP'
          print('registry consistency passed')
          PY

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
