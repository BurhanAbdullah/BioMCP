name: Validate BioMCP website docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate website entrypoint
        run: test -s docs/index.html

      - name: Validate linked local pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("docs")
          html = (root / "index.html").read_text(encoding="utf-8")
          links = re.findall(r'href=[\"\']([^\"\']+)[\"\']', html)
          local = [link.split("#", 1)[0].split("?", 1)[0] for link in links]
          missing = [link for link in local if link and not link.startswith(("http://", "https://", "mailto:", "javascript:")) and not (root / link).exists()]
          if missing:
              raise SystemExit("Missing local website targets: " + ", ".join(sorted(set(missing))))
          PY
